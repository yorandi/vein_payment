{% extends "base.html" %}
{% set page = 'merchant' %}
{% block title %}Saldo Merchant — VeinPay{% endblock %}
{% block content %}
<div class="page-wide">
  <div class="page-hero">
    <div class="page-hero-title">Manajemen UMKM</div>
    <div class="page-hero-sub">Tambahkan UMKM agar dapat menerima pembayaran VeinPay.</div>
  </div>

  <div class="card">
    <div class="card-title">Tambah UMKM Baru</div>
    <label class="form-label" for="merchantName">Nama usaha / UMKM</label>
    <input class="form-input" id="merchantName" maxlength="100" autocomplete="off"
           placeholder="Contoh: Warung Makan Bu Sari" onkeydown="if(event.key === 'Enter') addMerchant()">
    <button class="btn btn-primary" id="btnAddMerchant" onclick="addMerchant()">Tambah UMKM</button>
    <div class="result-banner" id="merchantResult"></div>
  </div>

  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <div class="card-title" style="margin-bottom:0;">Daftar Merchant</div>
      <button onclick="loadMerchantSaldo()" style="background:none;border:none;color:#1a56db;font-size:13px;font-weight:600;cursor:pointer;">🔄 Refresh</button>
    </div>
    <div id="merchantTableWrap"></div>
  </div>
</div>
{% endblock %}

{% block extra_script %}
<script>
async function loadMerchantSaldo() {
  const wrap = document.getElementById('merchantTableWrap');
  wrap.innerHTML = '<div class="empty">Memuat...</div>';
  try {
    const res = await fetch('/merchant_saldo');
    const rows = await res.json();

    if (!rows.length) {
      wrap.innerHTML = '<div class="empty">Belum ada merchant terdaftar.</div>';
      return;
    }

    let html = `<table class="tx-table">
      <tr><th>Merchant</th><th>Total Diterima</th></tr>`;
    rows.forEach(r => {
      html += `<tr>
        <td class="tx-name">${escapeHtml(r.nama_merchant)}</td>
        <td>${formatRupiah(r.total_diterima)}</td>
      </tr>`;
    });
    html += '</table>';
    wrap.innerHTML = html;
  } catch (e) {
    wrap.innerHTML = '<div class="empty">Gagal memuat data merchant.</div>';
  }
}

function escapeHtml(value) {
  const div = document.createElement('div');
  div.textContent = value;
  return div.innerHTML;
}

function showMerchantResult(type, message) {
  const result = document.getElementById('merchantResult');
  result.className = 'result-banner show ' + type;
  result.textContent = message;
}

async function addMerchant() {
  const input = document.getElementById('merchantName');
  const button = document.getElementById('btnAddMerchant');
  const nama_merchant = input.value.trim();
  if (!nama_merchant) {
    showMerchantResult('error', 'Masukkan nama UMKM terlebih dahulu.');
    input.focus();
    return;
  }

  button.disabled = true;
  try {
    const res = await fetch('/merchants', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nama_merchant })
    });
    const data = await res.json();
    if (!res.ok || data.status !== 'sukses') {
      showMerchantResult('error', data.message || 'UMKM gagal ditambahkan.');
      return;
    }
    input.value = '';
    showMerchantResult('success', `UMKM "${data.merchant.nama_merchant}" berhasil ditambahkan dan siap dipilih pada terminal pembayaran.`);
    loadMerchantSaldo();
  } catch (e) {
    showMerchantResult('error', 'Tidak dapat menghubungi server.');
  } finally {
    button.disabled = false;
  }
}

loadMerchantSaldo();
</script>
{% endblock %}
