{% extends "base.html" %}
{% set page = 'history' %}
{% block title %}Riwayat — VeinPay{% endblock %}
{% block content %}
<div class="page-wide">
  <div class="page-hero">
    <div class="page-hero-title">📜 Riwayat Transaksi</div>
    <div class="page-hero-sub">Log semua percobaan pembayaran & top-up</div>
  </div>

  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <div class="card-title" style="margin-bottom:0;">Transaksi Terakhir</div>
      <button onclick="loadHistory()" style="background:none;border:none;color:#1a56db;font-size:13px;font-weight:600;cursor:pointer;">🔄 Refresh</button>
    </div>
    <div id="tableWrap"></div>
  </div>
</div>
{% endblock %}

{% block extra_script %}
<script>
async function loadHistory() {
  const res = await fetch('/riwayat');
  const rows = await res.json();
  const wrap = document.getElementById('tableWrap');

  if (rows.length === 0) {
    wrap.innerHTML = '<div class="empty">Belum ada transaksi.</div>';
    return;
  }

  const jenisLabel = { topup: '➕ Top-up', payment: '💳 Bayar', transfer: '🔁 Transfer' };

  let html = `<table class="tx-table">
    <tr>
      <th>Waktu</th><th>Nama</th><th>Jenis</th><th>Tujuan</th><th>Jumlah</th><th>Status</th>
    </tr>`;

  rows.forEach(r => {
    const jumlah = formatRupiah(r.jumlah);
    const waktu  = r.waktu ? r.waktu.replace('T', ' ').substring(0, 19) : '—';
    const tujuan = r.jenis_transaksi === 'payment'  ? (r.nama_merchant || '—')
                 : r.jenis_transaksi === 'transfer' ? (r.nama_tujuan || '—')
                 : '—';
    html += `<tr>
      <td style="white-space:nowrap;font-size:12px;">${waktu}</td>
      <td class="tx-name">${r.nama || '—'}</td>
      <td><span class="status-badge ${r.jenis_transaksi}">${jenisLabel[r.jenis_transaksi] || r.jenis_transaksi}</span></td>
      <td>${tujuan}</td>
      <td>${jumlah}</td>
      <td><span class="status-badge ${r.status}">${r.status}</span></td>
    </tr>`;
  });

  html += '</table>';
  wrap.innerHTML = html;
}

loadHistory();
</script>
{% endblock %}
